<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CK3 Build Suite</title>
<style>
  /* Dark is the default, like the game's own interface; the light set follows the system preference. */
  :root {
    --bg: #1a1416; --fg: #efe6d8; --muted: #a89a95; --card: #251c1f; --line: #3d2f33;
    --accent: #a8293c; --on-accent: #fff; --gold: #d9a93a; --gain: #7fc29f; --err: #e8743b;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2eeea; --fg: #231a1c; --muted: #6b5d5a; --card: #fff; --line: #ddd3cf;
      --accent: #8b1e2d; --on-accent: #fff; --gold: #8a6410; --gain: #2f6b4f; --err: #b4470f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  .shell { max-width: 1280px; margin: 0 auto; display: grid; gap: 8px 32px; }
  main { min-width: 0; }
  aside header { margin-bottom: 8px; }
  @media (min-width: 800px) {
    .shell { grid-template-columns: 210px 1fr; align-items: start; }
    aside { position: sticky; top: 16px; }
    aside header { flex-direction: column; align-items: stretch; }
  }
  h1, h2 { font-family: var(--serif); font-weight: 600; color: var(--gold); }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 8px; }
  details.cat { border-bottom: 1px solid var(--line); }
  details.cat > summary { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-family: var(--serif); color: var(--gold); text-transform: capitalize; }
  details.cat > summary .count { margin-left: auto; color: var(--muted); font: .85rem system-ui, sans-serif; text-transform: none; font-variant-numeric: tabular-nums; }
  details.cat .trait:last-child { border-bottom: 0; }
  h3 { font-family: var(--serif); font-size: 1rem; margin: 20px 0 4px; color: var(--gold); }
  .cat { text-transform: capitalize; }
  p, label { color: var(--muted); margin: 0 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; margin-top: 16px; }
  button, select, input { font: inherit; color: var(--fg); }
  button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
  button.secondary { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  select, input[type=number], input[type=search] { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-height: 44px; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  #status { margin-top: 16px; min-height: 1.5em; }
  #status.error { color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td:last-child, th:last-child { text-align: right; }
  .hidden { display: none; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  nav { display: flex; gap: 4px; margin-top: 8px; border-bottom: 1px solid var(--line); }
  nav button { background: transparent; color: var(--muted); border-radius: 6px 6px 0 0; border-bottom: 3px solid transparent; text-align: left; }
  nav button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
  @media (min-width: 800px) {
    nav { flex-direction: column; border-bottom: 0; border-left: 1px solid var(--line); }
    nav button { border-radius: 0 6px 6px 0; border-bottom: 0; border-left: 3px solid transparent; margin-left: -1px; }
    nav button[aria-selected=true] { border-left-color: var(--accent); background: var(--card); }
  }
  nav button:not([aria-selected=true]):hover { color: var(--fg); }

  /* Ruler designer: flat layout, no cards. The point gauge is the one loud element. */
  #designer-body { display: grid; gap: 0 32px; }
  @media (min-width: 800px) { #designer-body { grid-template-columns: 360px 1fr; align-items: start; } #controls { position: sticky; top: 16px; } }
  #designer-panel { background: none; border: 0; padding: 0; }
  #budget { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 12px 0 8px; grid-column: 1 / -1; }
  @media (min-width: 800px) { #budget { position: static; } }
  .gauge { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .gauge > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  #budget.over .gauge > i { background: var(--err); }
  .points { font-family: var(--serif); font-size: 2rem; line-height: 1.1; margin-bottom: 6px; color: var(--fg); }
  .points small { font-size: 1rem; color: var(--muted); }
  #budget-note { color: var(--muted); }
  #budget.over #budget-note { color: var(--err); font-weight: 600; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  input[type=number] { width: 5.5em; }
  input[type=search] { width: 100%; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); min-height: 44px; }
  .skill label { margin: 0; }
  .skill { display: grid; grid-template-columns: 7.5em 1fr 2.2em 3.2em; align-items: center; gap: 8px; margin-top: 4px; }
  .skill .value { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  .skill .pts { text-align: right; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .trait { display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--line); color: var(--fg); margin: 0; cursor: pointer; }
  .trait input { width: 20px; height: 20px; accent-color: var(--gold); }
  .trait.blocked { opacity: .45; cursor: not-allowed; }
  .trait .cost { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .trait .cost.gain { color: var(--gain); }
  @media (prefers-reduced-motion: reduce) { .gauge > i { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <header>
      <h1 data-i18n="title">CK3 Build Suite</h1>
      <select id="ui-lang" data-i18n-aria="ui.language" aria-label="Interface language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
    </header>
    <nav role="tablist">
      <button role="tab" id="tab-data" aria-selected="true" data-i18n="tab.data"></button>
      <button role="tab" id="tab-designer" aria-selected="false" data-i18n="tab.designer"></button>
    </nav>
  </aside>
<main>
  <p data-i18n="intro"></p>

  <div id="panel-designer" class="hidden">
    <section id="designer-panel">
      <p id="designer-empty" class="hidden" data-i18n="designer.needData"></p>
      <div id="designer-body" class="hidden">
        <div id="budget" role="status">
          <div class="points"><span id="points-total"></span><small id="points-max"></small></div>
          <div class="gauge"><i id="gauge-fill"></i></div>
          <div id="budget-note"></div>
        </div>
        <div id="controls">
        <div class="field"><label for="age" data-i18n="designer.age"></label><input type="number" id="age" min="16" step="1"></div>
        <h3 data-i18n="designer.skills"></h3>
        <div id="skills"></div>
        <h3 data-i18n="designer.children"></h3>
        <div class="field"><label for="sons" data-i18n="designer.sons"></label><input type="number" id="sons" min="0" step="1"></div>
        <div class="field"><label for="daughters" data-i18n="designer.daughters"></label><input type="number" id="daughters" min="0" step="1"></div>
        <div class="row">
          <button id="share" data-i18n="designer.share"></button>
          <button id="reset" class="secondary" data-i18n="designer.reset"></button>
        </div>
        </div>
        <div id="traits-col">
        <h3 data-i18n="designer.traits"></h3>
        <input type="search" id="trait-search" data-i18n-aria="designer.search" aria-label="Search traits" data-i18n-placeholder="designer.search">
        <div id="trait-list"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="panel-data">
  <section id="import">
    <h2 data-i18n="import.title"></h2>

    <div id="direct" class="hidden">
      <p data-i18n-html="direct.text"></p>
      <div class="row">
        <button id="pick-game" data-i18n="direct.pick"></button>
        <button id="use-manual" class="secondary" data-i18n="direct.manual"></button>
      </div>
    </div>

    <div id="manual" class="hidden">
      <p id="manual-note" data-i18n-html="manual.note"></p>
      <label><span data-i18n-html="manual.traits"></span><br><input type="file" id="traits-input" webkitdirectory></label>
      <label><span data-i18n-html="manual.locEn"></span><br><input type="file" id="loc-en-input" webkitdirectory></label>
      <label><span data-i18n-html="manual.locEs"></span><br><input type="file" id="loc-es-input" webkitdirectory></label>
      <label><span data-i18n-html="manual.values"></span><br><input type="file" id="values-input" accept=".txt"></label>
      <label><span data-i18n-html="manual.defines"></span><br><input type="file" id="defines-input" accept=".txt"></label>
      <div class="row">
        <button id="run-manual" data-i18n="manual.import"></button>
      </div>
    </div>
  </section>

  <section id="transfer">
    <h2 data-i18n="transfer.title"></h2>
    <p data-i18n="transfer.text"></p>
    <div class="row">
      <button id="export" class="secondary" data-i18n="transfer.export" disabled></button>
      <label class="secondary"><input type="file" id="import-file" accept="application/json"></label>
      <button id="clear" class="secondary" data-i18n="transfer.clear" disabled></button>
    </div>
  </section>

  <div id="status" role="status"></div>

  <section id="summary" class="hidden">
    <h2 data-i18n="summary.title"></h2>
    <p id="summary-text"></p>
    <table><thead><tr><th data-i18n="summary.category"></th><th data-i18n="summary.traits"></th></tr></thead><tbody id="summary-rows"></tbody></table>
  </section>
  </div>
</main>
</div>

<script type="module">
import {
  readFromGameDir, readFromFileLists, buildDataset,
  exportDataset, parseDataset, saveDataset, loadDataset, clearDataset,
} from './importer.js';
import {
  applyTranslations, describeError, detectLang, loadSavedLang, saveLang, translate,
} from './i18n.js';
import { SKILLS, skillCost } from './designer.js';
import { designerTraits, conflictsOf, evaluate, encodeBuild, decodeBuild, MIN_AGE } from './build.js';

const $ = (id) => document.getElementById(id);
let lang = detectLang(loadSavedLang(), navigator.language);
let current = null;
// What the status line shows, kept as a function so it can be redrawn when the language changes.
let statusView = null;

const LANG_NAMES = { en: 'English', es: 'Español' };
const t = (key, params) => translate(lang, key, params);

function say(view, isError = false) {
  statusView = view;
  const el = $('status');
  el.textContent = view();
  el.className = isError ? 'error' : '';
}

function fail(error) {
  say(() => describeError(lang, error), true);
}

function render(dataset) {
  current = dataset;
  if (build && !dataset) build = null;
  $('export').disabled = $('clear').disabled = !dataset;
  $('summary').classList.toggle('hidden', !dataset);
  if (!dataset) { renderDesigner(); return; }
  const counts = new Map();
  for (const trait of dataset.traits) {
    const cat = trait.category ?? 'congenital';
    counts.set(cat, (counts.get(cat) ?? 0) + 1);
  }
  $('summary-text').textContent = t('summary.text', { count: dataset.traits.length, languages: dataset.languages.map((l) => LANG_NAMES[l] ?? l).join(', '), date: dataset.generatedAt.slice(0, 10) });
  $('summary-rows').replaceChildren(...[...counts].sort().map(([cat, n]) => {
    const tr = document.createElement('tr');
    const label = t(`cat.${cat}`);
    tr.append(
      Object.assign(document.createElement('td'), { textContent: label === `cat.${cat}` ? cat : label }),
      Object.assign(document.createElement('td'), { textContent: n }),
    );
    return tr;
  }));
  renderDesigner();
}

// ---- Ruler designer ----
const freshBuild = (d) => ({ age: 20, skills: Object.fromEntries(SKILLS.map((s) => [s, d.rules.defaultSkill])), traits: [], sons: 0, daughters: 0 });
let build = null;
let traitFilter = '';
const openCats = new Set();
const traitName = (trait) => trait.names[lang] ?? trait.names.en ?? trait.id;

function readHash() {
  const code = location.hash.match(/^#b=(.+)$/)?.[1];
  return code ? decodeBuild(code) : null;
}

function showTab(name) {
  const designer = name === 'designer';
  $('panel-designer').classList.toggle('hidden', !designer);
  $('panel-data').classList.toggle('hidden', designer);
  $('tab-designer').setAttribute('aria-selected', designer);
  $('tab-data').setAttribute('aria-selected', !designer);
}

function renderBudget() {
  const { total, remaining } = evaluate(current, build);
  const max = current.rules.pointMax;
  $('budget').className = remaining < 0 ? 'over' : '';
  $('points-total').textContent = total;
  $('points-max').textContent = ` / ${max}`;
  $('gauge-fill').style.width = `${Math.min(100, Math.max(0, (total / max) * 100))}%`;
  $('budget-note').textContent = remaining < 0 ? t('designer.over', { over: -remaining }) : t('designer.left', { left: remaining });
  history.replaceState(null, '', `#b=${encodeBuild(build)}`);
}

function renderTraits() {
  const blocked = conflictsOf(current, build.traits);
  const needle = traitFilter.trim().toLowerCase();
  const byCategory = new Map();
  for (const trait of designerTraits(current)) {
    const name = traitName(trait);
    if (needle && !name.toLowerCase().includes(needle)) continue;
    const cat = trait.category ?? 'congenital';
    if (!byCategory.has(cat)) byCategory.set(cat, []);
    byCategory.get(cat).push([trait, name]);
  }
  const nodes = [];
  for (const [cat, items] of [...byCategory].sort(([a], [b]) => a.localeCompare(b))) {
    const label = t(`cat.${cat}`);
    const group = document.createElement('details');
    group.className = 'cat';
    // A search opens every group that matches; otherwise the group stays as the person left it.
    group.open = Boolean(needle) || openCats.has(cat);
    group.addEventListener('toggle', () => {
      if (needle) return;
      if (group.open) openCats.add(cat); else openCats.delete(cat);
    });
    const picked = items.filter(([trait]) => build.traits.includes(trait.id)).length;
    const summary = document.createElement('summary');
    summary.append(Object.assign(document.createElement('span'), { textContent: label === `cat.${cat}` ? cat : label }),
      Object.assign(document.createElement('span'), { className: 'count', textContent: picked ? `${picked} / ${items.length}` : items.length }));
    group.append(summary);
    for (const [trait, name] of items.sort((a, b) => a[1].localeCompare(b[1]))) {
      const isPicked = build.traits.includes(trait.id);
      const row = document.createElement('label');
      row.className = `trait${blocked.has(trait.id) && !isPicked ? ' blocked' : ''}`;
      const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: isPicked, disabled: blocked.has(trait.id) && !isPicked });
      box.onchange = () => {
        build.traits = box.checked ? [...build.traits, trait.id] : build.traits.filter((id) => id !== trait.id);
        renderTraits();
        renderBudget();
      };
      row.append(box, Object.assign(document.createElement('span'), { textContent: name }),
        Object.assign(document.createElement('span'), { className: `cost${trait.cost < 0 ? ' gain' : ''}`, textContent: (trait.cost > 0 ? '+' : '') + trait.cost }));
      group.append(row);
    }
    nodes.push(group);
  }
  $('trait-list').replaceChildren(...nodes);
}

function numberField(id, value, min, onChange) {
  const input = $(id) ?? Object.assign(document.createElement('input'), { type: 'number', step: 1, id });
  input.min = min;
  input.value = value;
  input.oninput = () => { const n = Math.floor(Number(input.value)); if (Number.isFinite(n) && n >= min) { onChange(n); renderBudget(); } };
  return input;
}

function renderDesigner() {
  const ready = Boolean(current);
  $('designer-empty').classList.toggle('hidden', ready);
  $('designer-body').classList.toggle('hidden', !ready);
  if (!ready) return;
  if (!build) build = { ...freshBuild(current), ...readHash() };
  build.skills = { ...freshBuild(current).skills, ...build.skills };
  // Groups that already hold a picked trait (for example from a shared link) start open.
  for (const trait of current.traits) if (build.traits.includes(trait.id)) openCats.add(trait.category ?? 'congenital');
  numberField('age', build.age, MIN_AGE, (n) => { build.age = n; });
  numberField('sons', build.sons ?? 0, 0, (n) => { build.sons = n; });
  numberField('daughters', build.daughters ?? 0, 0, (n) => { build.daughters = n; });
  $('skills').replaceChildren(...SKILLS.map((skill) => {
    const tiers = skill === 'prowess' ? current.rules.skillCosts.prowess : current.rules.skillCosts.general;
    const row = document.createElement('div');
    row.className = 'skill';
    const slider = Object.assign(document.createElement('input'), { type: 'range', id: `skill-${skill}`, min: 0, max: 30, step: 1, value: build.skills[skill] });
    const value = Object.assign(document.createElement('span'), { className: 'value', textContent: build.skills[skill] });
    const pts = Object.assign(document.createElement('span'), { className: 'pts', textContent: skillCost(tiers, build.skills[skill]) });
    slider.oninput = () => {
      build.skills[skill] = Number(slider.value);
      value.textContent = slider.value;
      pts.textContent = skillCost(tiers, build.skills[skill]);
      renderBudget();
    };
    row.append(Object.assign(document.createElement('label'), { htmlFor: slider.id, textContent: t(`skill.${skill}`) }), slider, value, pts);
    return row;
  }));
  renderTraits();
  renderBudget();
}

$('tab-data').onclick = () => showTab('data');
$('tab-designer').onclick = () => showTab('designer');
// Rebuilding every trait row per keystroke is wasteful on phones, so wait for a pause in typing.
let searchTimer;
$('trait-search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { traitFilter = e.target.value; renderTraits(); }, 150);
};
$('reset').onclick = () => { build = freshBuild(current); renderDesigner(); };
$('share').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); say(() => t('designer.copied')); } catch { say(() => t('designer.copyFailed'), true); }
};

function setLang(next) {
  lang = next;
  saveLang(lang);
  $('ui-lang').value = lang;
  applyTranslations(document, lang);
  if (current) render(current);
  renderDesigner();
  if (statusView) say(statusView, $('status').className === 'error');
}

async function finish(input) {
  const dataset = await buildDataset(input);
  let saved = true;
  try { await saveDataset(dataset); } catch { saved = false; }
  render(dataset);
  if (saved) say(() => t('status.done', { count: dataset.traits.length }));
  else say(() => t('status.saveFailed'), true);
}

async function run(task) {
  say(() => t('status.reading'));
  try { await task(); } catch (e) { fail(e); }
}

// The browser refuses some folders (for example anything under Program Files) and reports a cancelled
// dialog afterwards, so a cancel is the only signal we get. Offer the manual form either way.
function showManual(noteKey) {
  $('manual-note').dataset.i18nHtml = noteKey;
  $('manual-note').innerHTML = t(noteKey);
  $('manual').classList.remove('hidden');
}

if ('showDirectoryPicker' in window) {
  $('direct').classList.remove('hidden');
  $('use-manual').onclick = () => showManual('manual.noteAlt');
  $('pick-game').onclick = async () => {
    say(() => t('status.reading'));
    try {
      const gameDir = await window.showDirectoryPicker({ id: 'ck3-game', mode: 'read' });
      await finish(await readFromGameDir(gameDir));
    } catch (e) {
      if (e.name === 'AbortError') {
        showManual('manual.noteAlt');
        say(() => t('status.cancelled'));
      } else {
        showManual('manual.noteAlt');
        fail(e);
      }
    }
  };
} else {
  $('manual').classList.remove('hidden');
}

$('run-manual').onclick = () => run(async () => {
  await finish(readFromFileLists(
    $('traits-input').files,
    { en: $('loc-en-input').files, es: $('loc-es-input').files },
    $('values-input').files[0] ?? null,
    $('defines-input').files[0] ?? null,
  ));
});

$('export').onclick = () => {
  const url = URL.createObjectURL(new Blob([exportDataset(current)], { type: 'application/json' }));
  Object.assign(document.createElement('a'), { href: url, download: 'ck3-dataset.json' }).click();
  URL.revokeObjectURL(url);
};

$('import-file').onchange = (e) => run(async () => {
  const file = e.target.files[0];
  if (!file) return;
  const dataset = parseDataset(await file.text());
  await saveDataset(dataset).catch(() => {});
  render(dataset);
  say(() => t('status.fileImported'));
});

$('clear').onclick = () => run(async () => { await clearDataset(); render(null); say(() => t('status.removed')); });

$('ui-lang').onchange = (e) => setLang(e.target.value);
setLang(lang);
loadDataset().then(render).catch(() => render(null));
if (readHash()) showTab('designer');
</script>
</body>
</html>
